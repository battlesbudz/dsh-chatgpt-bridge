# dsh-chatgpt-bridge bundle patch: applied as one insert over the profile
# entry list. Rows are id-keyed; later layers that already declare these ids
# (e.g. the web bundle) replace them with these identical values.
- insert:
    # Durable workspace registry (ctx.workspaceRegistry) + its storage backend.
    # These rows mirror the web bundle so the bridge works in any profile.
    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    # Write-behind cache for session projections (titles, stats). Optional
    # but makes dsh_list_sessions return titles for cold sessions.
    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    # The bridge itself. Disable this row (or remove the bundle) and the MCP
    # endpoint disappears while DSH keeps running untouched.
    - id: chatgpt-bridge
      name: 'dsh-chatgpt-bridge'
      config:
        transport: http
        host: 127.0.0.1
        port: 3456
        authMode: token
        authToken: ''
        authTokenEnv: DSH_CHATGPT_BRIDGE_TOKEN
        tokenFile: ''
        resultMaxChars: 8000
        resultMaxItems: 50
        sessionMaxItems: 20
        sessionMaxChars: 4000